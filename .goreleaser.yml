# Release config for pod-frozenlock-bbolt.
#
# Produces one archive per platform. The pod-registry manifest points at these
# archives, so the names here and the `artifact/url` entries there must agree.
version: 2

project_name: pod-frozenlock-bbolt

before:
  hooks:
    - go mod tidy

builds:
  - id: pod
    main: .
    binary: pod-frozenlock-bbolt
    env:
      - CGO_ENABLED=0
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]
    ldflags:
      - -s -w

archives:
  - id: pod
    formats: [zip]
    name_template: >-
      {{ .ProjectName }}_{{ .Version }}_{{ title .Os }}_{{ if eq .Arch "amd64" }}x86_64{{ else }}{{ .Arch }}{{ end }}

checksum:
  name_template: checksums.txt

changelog:
  use: github
  sort: asc
  filters:
    exclude:
      - '^docs:'
      - '^test:'
      - '^chore:'
